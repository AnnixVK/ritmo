<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sono</title>
<style>
:root{--bg:#0e0e12;--panel:#17171d;--p2:#202029;--line:#2a2a35;--text:#f4f3f8;--mut:#9b99a9;--acc:#a238ff;--acc2:#ff3d81;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{width:1em;height:1em;fill:currentColor;flex:none}
#app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:1fr auto;height:100dvh}
aside{grid-row:1;padding:20px 12px;background:#0a0a0d;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:-.5px;padding:0 10px 18px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center}
.logo svg{font-size:16px;color:#fff}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--mut);font-weight:600;text-align:left}
.nav svg{font-size:20px}
.nav:hover{color:var(--text)}.nav.on{color:var(--text);background:var(--p2)}
main{grid-row:1;grid-column:2;overflow:auto;padding:0 28px 28px}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,transparent);padding:18px 0 14px}
.sb{display:flex;gap:10px;align-items:center;background:var(--p2);border-radius:999px;padding:0 16px;height:46px;border:1px solid var(--line);max-width:560px}
.sb:focus-within{border-color:var(--acc)}
.sb input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;outline:0}
.sb svg{color:var(--mut);font-size:18px}
.tabs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.pill{padding:7px 16px;border-radius:999px;background:var(--p2);color:var(--text);font-weight:600;font-size:14px;white-space:nowrap;border:1px solid transparent}
.pill.on{background:var(--text);color:#111}
h2{font-size:24px;letter-spacing:-.4px;margin:18px 0 12px}
.sub{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.chips .pill{padding:11px 20px;font-size:15px}
.chips .pill:hover{border-color:var(--acc)}
.banner{margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--mut);max-width:560px}
.banner b{color:var(--text)}
.row{display:grid;grid-template-columns:48px 1fr minmax(0,.7fr) 34px 34px 44px;gap:12px;align-items:center;padding:7px 10px;border-radius:10px;cursor:pointer}
.row:hover{background:var(--panel)}.row.now{background:var(--p2)}.row.now b{color:var(--acc)}
.row img{width:48px;height:48px;border-radius:6px;background:var(--p2);object-fit:cover}
.m{min-width:0;display:flex;flex-direction:column}
.m b,.m span,.al{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m span,.al,.du{color:var(--mut);font-size:13px}
.du{text-align:right}
.ic{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--mut);font-size:19px}
.ic:hover{color:var(--text)}
.ic svg path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.on>svg path,.ic.on svg path{fill:var(--acc2);stroke:var(--acc2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.card{padding:12px;border-radius:14px;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.card:hover{background:var(--p2)}
.card b,.card span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:var(--mut);font-size:13px}
.cov{aspect-ratio:1;border-radius:10px;margin-bottom:8px;object-fit:cover;width:100%;background:var(--p2);display:grid;place-items:center;font-size:44px;font-weight:800;color:#fff}
.cov.art{border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.cov.fav{background:linear-gradient(135deg,#6b2fff,var(--acc2));font-size:52px}
.cov.pl{background:linear-gradient(135deg,#2b2b3a,#3a2a4f)}
.card.add .cov{background:none;border:2px dashed var(--line);color:var(--mut)}
.hero{display:flex;gap:20px;align-items:flex-end;margin:12px 0 18px;flex-wrap:wrap}
.hero .cov{width:170px;margin:0;flex:none}
.hero h1{font-size:34px;letter-spacing:-.8px;line-height:1.1}
.btn{padding:11px 26px;border-radius:999px;background:var(--acc);color:#fff;font-weight:700;margin-top:12px;margin-right:8px}
.btn.g{background:var(--p2)}
.sec{margin:26px 0 10px;font-size:19px;font-weight:700}
#player{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:1fr minmax(280px,1.4fr) 1fr;align-items:center;gap:16px;padding:10px 18px;background:#0a0a0d;border-top:1px solid var(--line);min-height:84px}
.pi{display:flex;align-items:center;gap:12px;min-width:0}
.pi img{width:56px;height:56px;border-radius:8px;background:var(--p2);object-fit:cover}
.pi .m b{font-size:14px}
.pc{display:flex;flex-direction:column;align-items:center;gap:4px}
.btns{display:flex;align-items:center;gap:10px}
.btns .ic{font-size:22px;color:var(--text)}
#pp{width:44px;height:44px;border-radius:50%;background:var(--text);color:#111;font-size:22px;display:grid;place-items:center}
.bar{display:flex;align-items:center;gap:10px;width:100%;font-size:12px;color:var(--mut)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--acc) var(--p,0%),#3a3a48 var(--p,0%));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.pr{display:flex;align-items:center;justify-content:flex-end;gap:10px}
#mode{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--p2);color:var(--mut);white-space:nowrap}
#mode.full{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2))}
#vol{width:90px;flex:none}
#ytbox{position:fixed;right:14px;bottom:100px;width:240px;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;z-index:20;box-shadow:0 10px 30px #0009}
#ytbox iframe{width:100%;height:100%}
#ytx{position:absolute;top:4px;right:4px;z-index:2;width:24px;height:24px;border-radius:50%;background:#000a;font-size:12px}
dialog{margin:auto;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:22px;width:min(380px,92vw)}
dialog::backdrop{background:#000a}
dialog h3{margin-bottom:12px}
dialog input[type=text],dialog input[type=password]{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--p2);color:var(--text);font:inherit;margin:8px 0}
dialog .li{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px}
dialog .li:hover{background:var(--p2)}
dialog p{color:var(--mut);font-size:13px;margin:6px 0}
dialog a{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--text);color:#111;padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.s{opacity:1}
.ic{position:relative}
.btns .ic.sr{color:var(--mut)}
.btns .ic.sr.act{color:var(--acc)}
.ic[data-r="2"]::after{content:"1";position:absolute;right:2px;bottom:2px;font-size:9px;font-weight:800;line-height:1}
#ytov{position:absolute;left:0;right:0;top:0;height:32px;z-index:1;touch-action:none;cursor:grab}
#ytov::after{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;border-radius:4px;background:#fffa;transform:translateX(-50%)}
#ytbox.off{opacity:0;pointer-events:none}
#ytsz{position:absolute;top:4px;left:4px;z-index:2;width:24px;height:24px;border-radius:50%;background:#000a;display:grid;place-items:center}
#ytsz svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
#ytbox.big{width:min(88vw,440px)}
#pa{cursor:pointer}
#np{position:fixed;inset:0;z-index:15;background:linear-gradient(180deg,#2c1850 0%,var(--bg) 60%);display:flex;flex-direction:column;align-items:center;gap:14px;padding:calc(10px + env(safe-area-inset-top,0px)) 20px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
#np[hidden]{display:none}
#np>*{width:min(100%,520px);flex:none}
.nph{display:flex;align-items:center;justify-content:space-between}
a.pill{text-decoration:none}
#npm{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;display:grid;place-items:center}
#npm.sq{aspect-ratio:1;width:min(100%,42vh)}
#npa{width:100%;height:100%;object-fit:cover}
#npm:not(.sq) #npa{display:none}
.npi{display:flex;align-items:center;gap:12px}
.npi .m{flex:1}.npi .m b{font-size:20px}
#np .btns{justify-content:space-between;gap:6px}
#np .btns .ic{font-size:26px}
#npp{width:64px;height:64px;border-radius:50%;background:var(--text);color:#111;font-size:30px;display:grid;place-items:center}
.npv{display:flex;align-items:center;gap:12px;color:var(--mut)}
.npv svg{font-size:22px}.npv input{flex:1}
#ytbox.fs{border-radius:14px;box-shadow:none}
#ytbox.fs #ytov,#ytbox.fs #ytsz,#ytbox.fs #ytx{display:none}
.hs{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.hs .card{width:140px;flex:none}
.c2{background:#ffffff0f;border-radius:14px;padding:14px 16px}
.c2 b{display:block;margin-bottom:6px}
.c2 p{margin:4px 0;color:var(--mut);font-size:14px}
#nlyr{white-space:pre-wrap;font:inherit;line-height:1.7;margin:0}
.tabs[hidden]{display:none}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill.act{background:var(--acc);color:#fff}
dialog .ql{max-height:50vh;overflow:auto;margin:8px 0}
.qi{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;cursor:pointer}
.qi.now{background:var(--p2)}.qi.now b{color:var(--acc)}
.qi img{width:40px;height:40px;border-radius:6px;object-fit:cover;background:var(--p2)}
.qi .m{flex:1}
.lr{display:flex;align-items:center;gap:14px;padding:8px;border-radius:12px;cursor:pointer}
.lr:hover{background:var(--panel)}
.lr .lc{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:linear-gradient(135deg,#2b2b3a,#3a2a4f);display:grid;place-items:center;font-size:26px;font-weight:800;color:#fff}
.lr .lc.fav{background:linear-gradient(135deg,#6b2fff,var(--acc2));font-size:30px}
.lr .m b{font-size:16px}
.lh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.lh b{margin:0!important}
.lh .pill{padding:4px 10px;font-size:12px}
#nlbox{position:relative;max-height:45vh;overflow:auto}
.ll{display:block;min-height:1.2em;padding:3px 0;color:var(--mut);transition:color .25s}
.ll.on{color:var(--text);font-weight:700}
#nlyr.plain .ll{color:var(--text)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pills .pill{padding:7px 13px;font-size:13px}
@media(max-width:760px){
#app{grid-template-columns:1fr;grid-template-rows:1fr auto auto}
aside{grid-row:3;grid-column:1;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;border-top:1px solid var(--line)}
.logo{display:none}
.nav{flex-direction:column;gap:2px;font-size:11px;padding:6px 14px}
main{grid-column:1;padding:0 14px 20px}
.row{grid-template-columns:48px 1fr 34px 34px}
.al,.du{display:none}
#player{grid-row:2;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 14px}
.pc{grid-column:1/-1;grid-row:2}
.pr{display:none}
.hero .cov{width:130px}.hero h1{font-size:26px}
#ytbox{width:150px;bottom:190px;right:10px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <aside>
  <div class="logo"><i><svg viewBox="0 0 24 24"><path d="M4 10h3v10H4zM10.5 4h3v16h-3zM17 8h3v12h-3z"/></svg></i>Sono</div>
  <button class="nav on" data-nav="home"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-2.5v9h-5v-6h-3v6h-5v-9H3z"/></svg>Inicio</button>

  <button class="nav" data-nav="lib"><svg viewBox="0 0 24 24"><path d="M4 4h3v16H4zM9 4h3v16H9zM14.2 5.3l2.9-.8 3.9 14.6-2.9.8z"/></svg>Biblioteca</button>
  <button class="nav" data-nav="set"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM10.4 2h3.2l.5 2.6 1.8.8 2.2-1.5 2.3 2.3-1.5 2.2.8 1.8 2.6.5v3.2l-2.6.5-.8 1.8 1.5 2.2-2.3 2.3-2.2-1.5-1.8.8-.5 2.6h-3.2l-.5-2.6-1.8-.8-2.2 1.5-2.3-2.3 1.5-2.2-.8-1.8L2 13.6v-3.2l2.6-.5.8-1.8-1.5-2.2 2.3-2.3 2.2 1.5 1.8-.8z"/></svg>Ajustes</button>
 </aside>
 <main>
  <div class="top">
   <label class="sb"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg><input id="q" type="search" placeholder="¿Qué quieres escuchar?" autocomplete="off" enterkeyhint="search"></label>
   <div class="tabs" id="tabs" hidden>
    <button class="pill on" data-tab="songs">Canciones</button><button class="pill" data-tab="artists">Artistas</button><button class="pill" data-tab="albums">Álbumes</button><button class="pill" data-tab="audius">Audius</button>
   </div>
  </div>
  <div id="view"></div>
 </main>
 <footer id="player">
  <div class="pi"><img id="pa" alt=""><div class="m"><b id="pt">Nada sonando</b><span id="pn">Busca una canción</span></div><button class="ic" id="ph" aria-label="Favorito"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.3-9A5.2 5.2 0 0 1 12 6.5 5.2 5.2 0 0 1 21.3 12C19 16.5 12 21 12 21z"/></svg></button><button class="ic" id="pl2" aria-label="Añadir a playlist"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button class="ic" id="pe" aria-label="Abrir reproductor"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button></div>
  <div class="pc">
   <div class="btns"><button class="ic sr" id="sh" aria-label="Aleatorio"><svg viewBox="0 0 24 24"><path d="M3 6h3.5c3 0 4.5 2 6 6s3 6 6 6H21M3 18h3.5c1.6 0 2.8-.6 3.8-1.7M13.7 7.7C14.7 6.6 16 6 17.5 6H21M18 3l3 3-3 3M18 15l3 3-3 3"/></svg></button><button class="ic" id="pv" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button><button id="pp" aria-label="Reproducir"></button><button class="ic" id="nx" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button><button class="ic sr" id="rp" data-r="0" aria-label="Repetir"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></button></div>
   <div class="bar"><span id="tc">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="td">0:00</span></div>
  </div>

 </footer>
</div>
<div id="ytbox" hidden><button id="ytsz" aria-label="Agrandar vídeo"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/></svg></button><button id="ytx" aria-label="Ocultar vídeo">✕</button><div id="yt"></div><div id="ytov"></div></div>
<section id="np" hidden>
 <div class="nph"><button class="ic" id="ncl" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><b>Reproduciendo</b><a class="pill" id="nly" target="_blank" rel="noopener">Letra</a></div>
 <div id="npm" class="sq"><img id="npa" alt=""></div>
 <div class="npi"><div class="m"><b id="npt"></b><span id="nps"></span></div><button class="ic" id="npl" aria-label="Añadir a playlist"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button class="ic" id="nph" aria-label="Favorito"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.3-9A5.2 5.2 0 0 1 12 6.5 5.2 5.2 0 0 1 21.3 12C19 16.5 12 21 12 21z"/></svg></button></div>
 <div class="bar"><span id="ntc">0:00</span><input type="range" id="nseek" min="0" max="1000" value="0"><span id="ntd">0:00</span></div>

 <div class="npv"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2"/></svg><input type="range" id="nvol" min="0" max="100" value="80" aria-label="Volumen"></div>
 <div class="acts"><button class="pill" id="nq">Cola</button><button class="pill" id="nsl">Dormir</button><button class="pill" id="nsr">Compartir</button></div>

 <div class="c2" id="nbio" hidden></div>

</section>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let jc=0;
const jsonp=u=>new Promise((res,rej)=>{
 const n='_cb'+(++jc)+Date.now(),sc=document.createElement('script');
 const cl=()=>{clearTimeout(t);delete window[n];sc.remove()};
 const t=setTimeout(()=>{cl();rej(new Error('tiempo agotado'))},12000);

 if(el=g('[data-qx]')){const i=+el.dataset.qx;if(i===qi)return toast('Esa es la que suena');queue.splice(i,1);if(i<qi)qi--;hist=[];return qDlg()}
 if(el=g('[data-qj]')){qi=+el.dataset.qj;$('#dlg').close();return playCur()}
 if(el=g('[data-sl]')){const v=el.dataset.sl;sleepAt=0;sleepEnd=false;if(v==='end')sleepEnd=true;else if(+v>0)sleepAt=Date.now()+v*60000;$('#nsl').classList.toggle('act',!!(sleepAt||sleepEnd));$('#dlg').close();return toast(v==='0'?'Temporizador desactivado':v==='end'?'Pararé al acabar esta canción':'Pararé en '+v+' min')}
 if(el=g('[data-lt]'))return lib(el.dataset.lt);
 if(el=g('[data-off]')){const t=cur;if(!t)return;lyoff[t.id]=Math.round(((lyoff[t.id]||0)+ +el.dataset.off)*10)/10;lyIdx=-2;const o=lyoff[t.id];return toast(o===0?'Letra sin ajuste':'Letra '+(o>0?'más pronto':'más tarde')+' '+Math.abs(o).toString().replace('.',',')+' s')}
 if(el=g('[data-rc]')){return play(store.get('rec',[]),+el.dataset.rc)}
 if(el=g('[data-nav]')){const n=el.dataset.nav;if(n!=='set')setNav(n);return n==='lib'?lib():n==='set'?settings():n==='home'?home():($('#q').value?search($('#q').value):explore())}
 if(el=g('.row'))return play(shown,+el.dataset.i);
});
function addDlg(){
 dlg(`<h3>Añadir</h3><button class="li" data-qnext>Reproducir a continuación</button><button class="li" data-qend>Añadir a la cola</button><p>Playlists</p>${lists.map((l,i)=>`<button class="li" data-addpl="${i}">${esc(l.name)} <span class="sub">· ${l.tracks.length}</span></button>`).join('')}<button class="li" data-newpl>+ Nueva playlist</button><button class="btn g" data-close>Cerrar</button>`);
}
let deb;$('#q').addEventListener('input',e=>{clearTimeout(deb);deb=setTimeout(()=>search(e.target.value),450)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(deb);search(e.target.value);e.target.blur()}});
$('#pp').onclick=toggle;$('#nx').onclick=()=>next();$('#pv').onclick=prev;
$('#ph').onclick=()=>{if(cur){toggleFav(cur);$$('.row').forEach(r=>{const t=shown[r.dataset.i];if(t)r.querySelector('[data-fav]').classList.toggle('on',isFav(t))})}};
$('#ytx').onclick=()=>{ytHide=true;store.set('ythide',true);$('#ytbox').classList.add('off');toast('Vídeo oculto. Toca la carátula para verlo')};
const sk=$('#seek');
sk.addEventListener('pointerdown',()=>seeking=true);
sk.addEventListener('input',()=>{sk.style.setProperty('--p',sk.value/10+'%');$('#tc').textContent=fmt(sk.value/1000*pos().d)});
sk.addEventListener('change',()=>{seek(sk.value/1000*pos().d);seeking=false});
const vl=$('#vol');
vl.addEventListener('input',()=>{vl.style.setProperty('--p',vl.value+'%');audio.volume=vl.value/100;if(yt&&yt.setVolume)yt.setVolume(+vl.value)});
vl.style.setProperty('--p','80%');
/* ---------- ventana de vídeo movible ---------- */
function fitYT(){
 const b=$('#ytbox');if(!b.style.left||b.hidden)return;
 const r=b.getBoundingClientRect(),l=Math.min(Math.max(0,r.left),innerWidth-r.width),t=Math.min(Math.max(0,r.top),innerHeight-r.height);
 b.style.left=l+'px';b.style.top=t+'px';b.style.right='auto';b.style.bottom='auto';return{l,t};
}
(()=>{
 const b=$('#ytbox'),o=$('#ytov');let sx,sy,ox,oy,d=false;
 const put=(l,t)=>{b.style.left=l+'px';b.style.top=t+'px';b.style.right='auto';b.style.bottom='auto'};
 o.addEventListener('pointerdown',e=>{const r=b.getBoundingClientRect();d=true;sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;o.setPointerCapture(e.pointerId)});
 o.addEventListener('pointermove',e=>{if(d)put(ox+e.clientX-sx,oy+e.clientY-sy)});
 const end=()=>{if(!d)return;d=false;const p=fitYT();if(p)store.set('ytpos',p)};
 o.addEventListener('pointerup',end);o.addEventListener('pointercancel',end);
 const p=store.get('ytpos',null);if(p)put(p.l,p.t);
 addEventListener('resize',fitYT);
})();
$('#ytbox').classList.toggle('big',store.get('ytbig',false));
$('#ytsz').onclick=()=>{const b=$('#ytbox'),big=!b.classList.contains('big');b.classList.toggle('big',big);store.set('ytbig',big);fitYT()};
$('#pa').onclick=()=>{
 if(mode!=='yt'||$('#ytbox').hidden)return;
 ytHide=!ytHide;store.set('ythide',ytHide);$('#ytbox').classList.toggle('off',ytHide);if(!ytHide)fitYT();
};

/* ---------- aleatorio y repetir ---------- */
const syncSR=()=>{for(const [a,b] of [['#sh','#rp'],['#nsh','#nrp']]){$(a).classList.toggle('act',shuffle);const r=$(b);r.classList.toggle('act',repeat>0);r.dataset.r=repeat}};
$('#sh').onclick=()=>{shuffle=!shuffle;store.set('shuf',shuffle);hist=[];syncSR();toast(shuffle?'Aleatorio activado':'Aleatorio desactivado')};
$('#rp').onclick=()=>{repeat=(repeat+1)%3;store.set('rep',repeat);syncSR();toast(['Repetir: no','Repetir todo','Repetir una canción'][repeat])};

/* ---------- controles en pantalla de bloqueo ---------- */
function mediaSession(){
 if(!('mediaSession' in navigator)||!cur||typeof MediaMetadata==='undefined')return;
 try{navigator.mediaSession.metadata=new MediaMetadata({title:cur.title,artist:cur.artist,album:cur.album||'',artwork:cur.art?[{src:cur.art,sizes:'400x400',type:'image/jpeg'}]:[]})}catch(e){}
}
function msPos(c,d){
 if(!('mediaSession' in navigator))return;
 try{navigator.mediaSession.playbackState=isPlaying()?'playing':(cur?'paused':'none');
  if(d>0&&c>=0&&c<=d)navigator.mediaSession.setPositionState({duration:d,playbackRate:1,position:c})}catch(e){}
}
if('mediaSession' in navigator){
 const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
 h('play',()=>{if(!isPlaying())toggle()});h('pause',()=>{if(isPlaying())toggle()});
 h('previoustrack',()=>prev());h('nexttrack',()=>next());
 h('seekto',e=>{if(e.seekTime!=null)seek(e.seekTime)});
}
/* ---------- pantalla de reproducción ---------- */
let npOpen=false,npSaved='',nsk=false;
function unfs(){const b=$('#ytbox');b.classList.remove('fs');b.setAttribute('style',npSaved||'');b.classList.toggle('off',ytHide);fitYT()}
function layoutNP(){
 if(!npOpen)return;
 const b=$('#ytbox'),m=$('#npm'),vid=mode==='yt'&&!b.hidden;
 m.classList.toggle('sq',!vid);
 if(vid){
  if(!b.classList.contains('fs'))npSaved=b.getAttribute('style')||'';
  const r=m.getBoundingClientRect();b.classList.add('fs');b.classList.remove('off');
  Object.assign(b.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',right:'auto',bottom:'auto'});
 }else if(b.classList.contains('fs'))unfs();
}
function npInfo(){
 if(!cur)return;
 $('#npa').src=cur.art;$('#npt').textContent=cur.title;$('#nps').textContent=cur.artist;
 $('#nph').classList.toggle('on',isFav(cur));
 $('#nly').href='https://www.google.com/search?q='+encodeURIComponent('letra '+cur.title+' '+cur.artist);
 $('#nin').innerHTML=`<b>Sobre la canción</b><p>${esc(cur.title)} · ${esc(cur.artist)}</p><p>${[cur.album,cur.year,cur.genre].filter(Boolean).map(esc).join(' · ')}</p>`;
 if(npOpen){loadLyr();loadBio()}
}
function npTick(c,d){
 $('#npp').innerHTML=isPlaying()?IC.pause:IC.play;
 if(!nsk){const p=d?c/d*1000:0;$('#nseek').value=p;$('#nseek').style.setProperty('--p',p/10+'%')}
 $('#ntc').textContent=fmt(c);$('#ntd').textContent=fmt(d);
 lySync(c);
}
const lyc={},bioc={};
const lyoff={};let lyIdx=-1;
const parseLrc=x=>{const o=[];for(const l of x.split('\n')){const m=l.match(/^((?:\[\d+:\d+(?:\.\d+)?\])+)(.*)$/);if(!m)continue;for(const st of m[1].match(/\[\d+:\d+(?:\.\d+)?\]/g)){const q=st.match(/\[(\d+):(\d+(?:\.\d+)?)\]/);o.push({t:+q[1]*60+ +q[2],x:m[2].trim()})}}return o.sort((a,b)=>a.t-b.t)};
function renderLyr(){
 const L=lyc[cur.id],el=$('#nlyr');lyIdx=-1;$('#nlbox').scrollTop=0;
 if(L&&L.s&&L.s.length){el.innerHTML=L.s.map(l=>`<span class="ll">${esc(l.x)||'&nbsp;'}</span>`).join('');$('#nlo').hidden=false}
 else if(L&&L.p){el.textContent=L.p;$('#nlo').hidden=true}
 else{el.textContent='No he encontrado la letra de esta canción. Prueba el botón «Letra» de arriba.';$('#nlo').hidden=true}
}
function lySync(c){
 const t=cur,L=t&&lyc[t.id],ok=mode==='yt'||(t&&t.src==='au');
 $('#nlyr').classList.toggle('plain',!ok);
 if(!ok||!L||!L.s||!L.s.length)return;
 const x=c+(lyoff[t.id]||0);let i=-1;for(let k=0;k<L.s.length;k++){if(L.s[k].t<=x)i=k;else break}
 if(i===lyIdx)return;lyIdx=i;
 const ls=$$('#nlyr .ll');ls.forEach((e,k)=>e.classList.toggle('on',k===i));
 const e=ls[i],b=$('#nlbox');if(e)b.scrollTo({top:e.offsetTop-b.clientHeight/2+e.clientHeight/2,behavior:'smooth'});
}
async function loadLyr(){
 const t=cur;if(!t)return;
 if(lyc[t.id]===undefined){
  $('#nlyr').textContent='Buscando letra…';$('#nlo').hidden=true;
  try{
   const cl=x=>x.replace(/\s*[\(\[].*?[\)\]]/g,'').replace(/\s+-\s+.*$/,'').trim(),ar=(t.artist||'').split(/,|&| feat\.?| ft\.?/i)[0].trim();
   const r=await fetch(`https://lrclib.net/api/search?track_name=${encodeURIComponent(cl(t.title))}&artist_name=${encodeURIComponent(ar)}`).then(r=>r.json());
   const b=(r||[]).filter(x=>x.plainLyrics||x.syncedLyrics).sort((a,b)=>Math.abs(a.duration-t.dur)-Math.abs(b.duration-t.dur))[0];
   lyc[t.id]=b?{p:b.plainLyrics||'',s:b.syncedLyrics?parseLrc(b.syncedLyrics):null}:{p:'',s:null};
  }catch(e){if(cur===t)$('#nlyr').textContent='No he podido cargar la letra ahora mismo.';return}
 }
 if(cur===t)renderLyr();
}
async function loadBio(){
 const t=cur,el=$('#nbio'),n=(t.artist||'').split(/,|&/)[0].trim();
 if(!n){el.hidden=true;return}
 if(bioc[n]===undefined){
  bioc[n]='';
  try{
   const d=await fetch('https://es.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(n)).then(r=>r.json());
   if(d.type==='standard'&&/cantante|banda|m[uú]sic|grupo|d[uú]o|rapero|compositor|productor|DJ|raper/i.test(d.extract||''))bioc[n]=d.extract.length>420?d.extract.slice(0,420).replace(/\s\S*$/,'')+'…':d.extract;
  }catch(e){delete bioc[n]}
 }
 if(cur!==t)return;
 el.hidden=!bioc[n];el.innerHTML=bioc[n]?`<b>Sobre ${esc(n)}</b><p>${esc(bioc[n])}</p><p>Fuente: Wikipedia</p>`:'';
}
function openNP(){if(!cur)return;npOpen=true;$('#np').hidden=false;npInfo();const nv=$('#nvol');nv.value=vl.value;nv.style.setProperty('--p',nv.value+'%');layoutNP()}
function closeNP(){npOpen=false;$('#np').hidden=true;if($('#ytbox').classList.contains('fs'))unfs()}
$('#pe').onclick=openNP;$('.pi .m').onclick=openNP;$('#ncl').onclick=closeNP;
$('#npp').innerHTML=IC.play;
$('#npp').onclick=toggle;$('#npv').onclick=()=>prev();$('#nnx').onclick=()=>next();
$('#nsh').onclick=()=>$('#sh').click();$('#nrp').onclick=()=>$('#rp').click();$('#nph').onclick=()=>$('#ph').click();
const ns=$('#nseek');
ns.addEventListener('pointerdown',()=>nsk=true);
ns.addEventListener('input',()=>{ns.style.setProperty('--p',ns.value/10+'%');$('#ntc').textContent=fmt(ns.value/1000*pos().d)});
ns.addEventListener('change',()=>{seek(ns.value/1000*pos().d);nsk=false});
const nv=$('#nvol');
nv.addEventListener('input',()=>{vl.value=nv.value;vl.dispatchEvent(new Event('input'));nv.style.setProperty('--p',nv.value+'%')});
$('#np').addEventListener('scroll',layoutNP);addEventListener('resize',layoutNP);
/* ---------- cola, temporizador y compartir ---------- */
let sleepAt=0,sleepEnd=false,wantPlay=false;
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState!=='visible'||!wantPlay||!cur)return;
 setTimeout(()=>{
  if(isPlaying())return;
  try{if(mode==='yt'&&yt&&yt.playVideo)yt.playVideo();else if(mode==='au')audio.play().catch(()=>{})}catch(e){}
  setTimeout(()=>{if(wantPlay&&cur&&!isPlaying())toast('Pulsa play para seguir')},1800);
 },400);
});
function pauseAll(){wantPlay=false;try{if(mode==='yt'&&yt&&yt.pauseVideo)yt.pauseVideo()}catch(e){}audio.pause()}
function qDlg(){
 if(!queue.length)return toast('La cola está vacía');
 dlg(`<h3>Cola · ${queue.length}</h3><div class="ql">${queue.map((t,i)=>`<div class="qi ${i===qi?'now':''}" data-qj="${i}"><img src="${esc(t.art)}" alt=""><div class="m"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div><button class="ic" data-qu="${i}" aria-label="Subir"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><button class="ic" data-qx="${i}" aria-label="Quitar">✕</button></div>`).join('')}</div><button class="btn g" data-close>Cerrar</button>`);
 const c=$('#dlg .qi.now');if(c)c.scrollIntoView({block:'center'});
}
function sleepDlg(){dlg(`<h3>Temporizador para dormir</h3>${[15,30,45,60].map(m=>`<button class="li" data-sl="${m}">${m} minutos</button>`).join('')}<button class="li" data-sl="end">Al terminar esta canción</button><button class="li" data-sl="0">Desactivar</button><button class="btn g" data-close>Cerrar</button>`)}
async function shareTrack(){
 const t=cur;if(!t)return;
 const url=ytc[t.id]?'https://youtu.be/'+ytc[t.id]:(t.url||'https://www.google.com/search?q='+encodeURIComponent(t.title+' '+t.artist)),text=t.title+' — '+t.artist;
 try{if(navigator.share){await navigator.share({title:t.title,text,url});return}}catch(e){if(e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(text+'\n'+url);toast('Enlace copiado')}
 catch(e){dlg(`<h3>Compartir</h3><input type="text" readonly value="${esc(text+' '+url)}" onfocus="this.select()"><button class="btn g" data-close>Cerrar</button>`)}
}
$('#nq').onclick=qDlg;$('#nsl').onclick=sleepDlg;$('#nsr').onclick=shareTrack;
/* ---------- fotos de artistas ---------- */
const aimg=store.get('aimg',{});
async function artImg(n){
 const k=n.toLowerCase();
 if(aimg[k]!==undefined)return aimg[k];
 try{
  const d=await jsonp('https://api.deezer.com/search/artist?limit=5&output=jsonp&q='+encodeURIComponent(n));
  const a=(d.data||[]).find(x=>{const m=(x.name||'').toLowerCase();return m&&(m===k||m.includes(k)||k.includes(m))});
  aimg[k]=a?(a.picture_big||a.picture_medium||''):'';store.set('aimg',aimg);return aimg[k];
 }catch(e){return ''}
}
function fillArtists(){
 $$('.cov.art[data-an]:not([data-d])').forEach(el=>{el.dataset.d=1;artImg(el.dataset.an).then(u=>{if(u){el.style.background=`center/cover url("${u}")`;el.textContent=''}})});
}
$('#pl2').onclick=$('#npl').onclick=()=>{if(cur){pend=cur;addDlg()}};
syncSR();setPP(false);loadYT();home();
</script>
